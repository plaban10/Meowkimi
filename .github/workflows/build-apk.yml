name: Build & Release Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set!"
            exit 1
          fi

          JAVA_VER_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER_STR"
          
          if [ -z "$JAVA_VER_STR" ]; then
            echo "Error: Unable to detect Java version from 'java -version' output!"
            exit 1
          fi
          
          MAJOR_VERSION=$(echo "$JAVA_VER_STR" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"
          
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Error: Failed to parse Java major version '$MAJOR_VERSION' as an integer!"
            exit 1
          fi
          
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Active Java version ($MAJOR_VERSION) is lower than required version 17!"
            exit 1
          fi
          
          echo "Java environment verified successfully (Java $MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          echo "=== Debug Keystore Setup ==="
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists, skipping creation."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore was not created or is missing!"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "=== Verifying Debug APK ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK '$EXPECTED_APK' was not found!"
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -print
            else
              echo "Directory 'app/build/outputs/apk' does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file '$EXPECTED_APK' exists but is empty (size 0)!"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: '$EXPECTED_APK' does not have the .apk extension!"; exit 1 ;;
          esac

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "Verified $EXPECTED_APK ($APK_SIZE bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          RAW_REPO_NAME="${{ github.event.repository.name }}"
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr -c 'a-zA-Z0-9_-' '-' | sed 's/^-//;s/-$//' | tr '[:upper:]' '[:lower:]')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RUN_NUM="${{ github.run_number }}"
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${RUN_NUM}.apk"
          
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"
          
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="${TEMP_RELEASE_DIR}/${ASSET_FILENAME}"
          
          cp "$SRC_APK" "$DEST_APK"
          
          if [ ! -s "$DEST_APK" ]; then
            echo "Error: Release asset '$DEST_APK' failed to copy or is empty!"
            exit 1
          fi

          echo "Release asset prepared: $DEST_APK"
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI ==="
          gh --version
          
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is missing or empty at '$ASSET_PATH'!"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          echo "Target Release Tag: $RELEASE_TAG"
          echo "Target Release Title: $RELEASE_TITLE"
          echo "Release Asset: $ASSET_PATH ($ASSET_NAME)"

          NOTES=$(cat << 'EOF'
          ### 🐾 Android Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number**: #${{ github.run_number }}
          - **Workflow Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: `${{ github.sha }}`
          - **Build Type**: Debug APK (Testing Build)

          > ℹ️ **Note**: This APK is intended for testing purposes and is signed only with a temporary debug keystore. It is not a Google Play Store production release.

          #### Download Instructions:
          Download the attached `.apk` file below directly to your Android device to install and test.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Workflow Result Summary ==="
          
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"
          REPO="${{ github.repository }}"
          SERVER_URL="${{ github.server_url }}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully!"
            gh release view "$RELEASE_TAG" || true
            
            RELEASE_URL="${SERVER_URL}/${REPO}/releases/tag/${RELEASE_TAG}"
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "Direct APK Asset: $ASSET_NAME"
            
            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Succeeded!

          - **Release Tag**: \`$RELEASE_TAG\`
          - **Release Title**: $RELEASE_TITLE
          - **APK Asset Filename**: \`$ASSET_NAME\`
          - **GitHub Release Page**: [$RELEASE_URL]($RELEASE_URL)

          ### 📱 How to Download on Android:
          1. Open the [GitHub Release Page]($RELEASE_URL).
          2. Under the **Assets** section, tap **\`$ASSET_NAME\`** to download and install on your device.
          3. *Backup*: The workflow artifact **\`app-debug-apk\`** is also available under the Actions run artifacts.
          EOF

          else
            echo "::warning ::GitHub Release publishing failed or was skipped. Outcome: $PUBLISH_OUTCOME"
            echo "The APK was successfully compiled and uploaded as the Actions artifact 'app-debug-apk'."
            
            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Build Succeeded (Release Publishing Failed/Skipped)

          - **Build Status**: ✅ Success (Debug APK compiled cleanly)
          - **Actions Artifact**: ✅ \`app-debug-apk\` is available under this workflow run's artifacts.
          - **Release Status**: ⚠️ Release publishing could not complete ($PUBLISH_OUTCOME).

          You can download the compiled APK from the **Artifacts** section at the bottom of this Actions run summary.
          EOF
          fi
